<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Protocolo</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.7.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#0f172a;color:#e2e8f0;padding:12px 12px calc(90px + env(safe-area-inset-bottom));font-size:15px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:#94a3b8;font-size:12px;margin-bottom:14px}
.card{background:#1e293b;border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid #334155}
.card h2{font-size:14px;margin:0 0 10px;color:#cbd5e1;text-transform:uppercase;letter-spacing:.5px}
label{display:block;font-size:12px;color:#94a3b8;margin:8px 0 4px}
input,select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:#e2e8f0;font-size:15px;font-family:inherit}
button{padding:11px 14px;border-radius:8px;border:none;background:#2563eb;color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
button:disabled{background:#334155;color:#64748b;cursor:not-allowed}
button.sec{background:#334155}
button.danger{background:#dc2626}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:0}
#login{position:fixed;inset:0;background:#0f172a;z-index:100;display:flex;flex-direction:column;justify-content:center;padding:24px}
#login.hide{display:none}
.nota{font-size:44px;font-weight:800;line-height:1}
.sit{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.ok{color:#22c55e}.at{color:#f59e0b}.al{color:#ef4444}
.barra{height:8px;background:#334155;border-radius:4px;overflow:hidden;margin:8px 0}
.barra>div{height:100%;background:#22c55e;transition:width .3s}
ul.lista{list-style:none;padding:0;margin:0;font-size:13px}
ul.lista li{padding:6px 0;border-bottom:1px solid #334155;display:flex;gap:8px;align-items:flex-start}
ul.lista li:last-child{border:0}
.chk{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:13px}
.chk input{width:18px;height:18px;flex:none}
#rodape{position:fixed;bottom:0;left:0;right:0;background:#1e293b;border-top:1px solid #334155;padding:10px 14px calc(10px + env(safe-area-inset-bottom));font-size:12px;color:#94a3b8;transform:translateY(120%);transition:transform .2s;z-index:50}
#rodape.show{transform:translateY(0)}
.mono{font-family:ui-monospace,monospace;font-size:12px;white-space:pre-wrap;background:#0f172a;padding:10px;border-radius:8px;border:1px solid #334155;max-height:300px;overflow:auto}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tabs button{flex:none;padding:8px 12px;font-size:13px;background:#1e293b;color:#94a3b8}
.tabs button.on{background:#2563eb;color:#fff}
.hide{display:none!important}
#grafPeso{width:100%;height:auto;background:#0f172a;border-radius:8px;margin-bottom:10px;display:block}
canvas#canvas{width:100%;max-width:300px;height:auto;border-radius:8px;display:block;margin-top:10px}
</style>
</head>
<body>

<div id="login">
  <h1>Protocolo</h1>
  <p class="sub">Entre para continuar</p>
  <label>Login</label>
  <input id="lgUser" inputmode="numeric" autocomplete="username">
  <label>Senha</label>
  <input id="lgPass" type="password" autocomplete="current-password">
  <div style="height:14px"></div>
  <button onclick="entrar()">Entrar</button>
  <p id="lgErro" class="sit al" style="margin-top:10px"></p>
</div>

<div id="app" class="hide">
  <h1>Protocolo</h1>
  <p class="sub" id="dataHoje"></p>

  <div class="tabs">
    <button class="on" onclick="aba('dia',this)">Dia</button>
    <button onclick="aba('hist',this)">Histórico</button>
    <button onclick="aba('aj',this)">Ajustes</button>
  </div>

  <div id="abaDia">
    <div class="card">
      <h2>Análise do dia</h2>
      <div style="display:flex;align-items:center;gap:14px">
        <div class="nota" id="nota">--</div>
        <div style="flex:1">
          <div class="sit" id="situacao">—</div>
          <div class="barra"><div id="barraNota" style="width:0%"></div></div>
        </div>
      </div>
      <ul class="lista" id="motivos" style="margin-top:10px"></ul>
    </div>

    <div class="card">
      <h2>Peso e pressão</h2>
      <div class="row">
        <div><label>Peso (kg)</label><input id="peso" type="number" step="0.1" inputmode="decimal"></div>
        <div><label>Sistólica</label><input id="sis" type="number" inputmode="numeric"></div>
        <div><label>Diastólica</label><input id="dia" type="number" inputmode="numeric"></div>
      </div>
      <button style="margin-top:10px" onclick="salvarVitais()">Salvar</button>
      <p class="sub" id="pesoMedia" style="margin:8px 0 0"></p>
    </div>

    <div class="card">
      <h2>Foto do rosto</h2>
      <input type="file" id="foto" accept="image/*" capture="user" onchange="carregarFoto(event)">
      <canvas id="canvas" class="hide" width="300" height="300"></canvas>
      <p class="sub" id="fotoResultado" style="margin:8px 0 0"></p>
    </div>

    <div class="card">
      <h2>Remédios</h2>
      <div id="remedios"></div>
    </div>

    <div class="card">
      <h2>Potássio</h2>
      <label>Potássio do MyFitnessPal (mg)</label>
      <input id="potassio" type="number" inputmode="numeric" oninput="salvarPotassio()">
      <p class="sub" id="potassioInfo" style="margin:8px 0 0"></p>
      <div class="barra"><div id="barraPot" style="width:0%"></div></div>
    </div>

    <div class="card">
      <h2>Cardio</h2>
      <div class="row">
        <button class="sec" onclick="registrarCardio('hiit')">HIIT</button>
        <button class="sec" onclick="registrarCardio('ladeira')">Ladeira</button>
        <button class="sec" onclick="registrarCardio('sem')">Sem cardio</button>
      </div>
      <div class="row" style="margin-top:8px">
        <select id="cardioHora">
          <option value="">Horário</option>
          <option>manhã</option><option>tarde</option><option>noite</option>
        </select>
        <select id="cardioJejum">
          <option value="">Jejum?</option>
          <option value="sim">Em jejum</option><option value="nao">Não</option>
        </select>
      </div>
      <select id="cardioMotivo" style="margin-top:8px">
        <option value="">Motivo (se "Sem cardio")</option>
        <option>tempo</option><option>lesão</option><option>descanso</option><option>doença</option>
      </select>
      <p class="sub" id="cardioInfo" style="margin:8px 0 0"></p>
    </div>

    <div class="card">
      <h2>Sintomas</h2>
      <div id="sintomas"></div>
    </div>

    <div class="card">
      <h2>Relatório do dia</h2>
      <button onclick="gerarRelatorio()">Gerar</button>
      <button class="sec" onclick="copiarRelatorio()">Copiar</button>
      <div class="mono hide" id="relatorio" style="margin-top:10px"></div>
    </div>
  </div>

  <div id="abaHist" class="hide">
    <div class="card">
      <h2>Peso — últimos 14 dias</h2>
      <canvas id="grafPeso" width="600" height="220"></canvas>
      <h2 style="margin-top:14px">Registros</h2>
      <div id="historico"></div>
    </div>
  </div>

  <div id="abaAj" class="hide">
    <div class="card">
      <h2>Dura</h2>
      <label>Data da última aplicação</label>
      <input type="date" id="ultimaDura" onchange="salvarDura()">
      <p class="sub" id="duraInfo" style="margin:8px 0 0"></p>
    </div>
    <div class="card">
      <h2>Espironolactona</h2>
      <p class="sub" id="espiroInfo"></p>
      <button onclick="subirEspiro()">Subir para 50 mg</button>
    </div>
    <div class="card">
      <h2>Backup</h2>
      <button onclick="exportar()">Exportar .json</button>
      <button class="sec" onclick="document.getElementById('importar').click()">Importar</button>
      <input type="file" id="importar" accept=".json,application/json" class="hide" onchange="importar(event)">
    </div>
    <div class="card">
      <button class="danger" onclick="sair()">Sair</button>
    </div>
  </div>
</div>

<div id="rodape"></div>

<script>
const CFG = { login: "03252691221", senha: "314159", potMeta: 3500, potMetaFuro: 4500, furoDias: [3, 6], espiroDose: 25, espiroDoseMax: 50, duraIntervalo: 4 };
const REMEDIOS = [
  {id:"furo",  nome:"Furosemida 40 mg",   hora:"manhã"},
  {id:"espiro",nome:"Espironolactona",     hora:"manhã"},
  {id:"ana",   nome:"Anastrozol 0,5 mg",   hora:"manhã"},
  {id:"iso",   nome:"Isotretinoína 20 mg", hora:"noite"},
  {id:"trembo",nome:"Trembolona 0,25 mg",  hora:"manhã"},
  {id:"dura",  nome:"Durateston",          hora:"manhã"}
];
const SINTOMAS = ["rosto piorou","rosto desinchou","cãibra","fraqueza","tontura","dor articular","pele seca","dor de cabeça","urina reduzida"];
let estado = {}, abaAtual = "dia", faceModelosProntos = false;

function hoje(){ const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function diaSemana(){ return new Date().getDay(); }
function ehDiaFuro(){ return CFG.furoDias.includes(diaSemana()); }
function diasEntre(a,b){ return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/86400000); }
function ontemStr(){ const d = new Date(); d.setDate(d.getDate()-1); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

function carregar(){
  try { estado = JSON.parse(localStorage.getItem("prot")||"{}"); } catch(e){ estado={}; }
  if(!estado.dias) estado.dias = {};
  if(!estado.cfg)  estado.cfg  = {};
  garantirDia();
}
function garantirDia(){
  const h = hoje();
  if(!estado.dias[h]) estado.dias[h] = { remedios:{}, sintomas:[], cardio:null };
  if(!estado.dias[h].remedios) estado.dias[h].remedios = {};
  if(!estado.dias[h].sintomas) estado.dias[h].sintomas = [];
}
function salvar(){ try{ localStorage.setItem("prot", JSON.stringify(estado)); }catch(e){ aviso("Não consegui salvar"); } }
function aviso(t){ const r = document.getElementById("rodape"); r.textContent = t; r.classList.add("show"); clearTimeout(r._t); r._t = setTimeout(()=>r.classList.remove("show"), 3000); }

function entrar(){
  const u = document.getElementById("lgUser").value.trim(), p = document.getElementById("lgPass").value;
  if(u===CFG.login && p===CFG.senha){
    localStorage.setItem("protSessao","1"); document.getElementById("login").classList.add("hide");
    document.getElementById("app").classList.remove("hide"); iniciar();
  } else { document.getElementById("lgErro").textContent = "Login ou senha errados"; }
}
function sair(){
  localStorage.removeItem("protSessao"); document.getElementById("login").classList.remove("hide"); document.getElementById("app").classList.add("hide");
}
function aba(n,b){
  abaAtual = n; document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on")); b.classList.add("on");
  document.getElementById("abaDia").classList.toggle("hide", n!=="dia"); document.getElementById("abaHist").classList.toggle("hide", n!=="hist"); document.getElementById("abaAj").classList.toggle("hide", n!=="aj");
  if(n==="hist") renderHistorico(); if(n==="aj") renderAjustes();
}
function iniciar(){
  carregar(); document.getElementById("dataHoje").textContent = new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long"});
  renderTudo(); if(!estado.cfg.ultimaDura) setTimeout(()=>aviso("Configure a última Dura em Ajustes"), 800);
}
function renderTudo(){ garantirDia(); renderRemedios(); renderSintomas(); renderCardio(); renderPotassio(); renderAnalise(); renderPeso(); }

function ultimoUso(id){ return Object.keys(estado.dias).filter(x=>estado.dias[x].remedios && estado.dias[x].remedios[id]).sort().pop(); }
function proxdura(){ if(!estado.cfg.ultimaDura) return "—"; const d = new Date(estado.cfg.ultimaDura+"T12:00:00"); d.setDate(d.getDate()+CFG.duraIntervalo); return d.toLocaleDateString("pt-BR"); }

function renderRemedios(){
  const d = estado.dias[hoje()], box = document.getElementById("remedios"); box.innerHTML = "";
  REMEDIOS.forEach(r=>{
    const feito = !!d.remedios[r.id], div = document.createElement("div"); div.className = "chk";
    let extra = "";
    if(r.id==="furo" && !ehDiaFuro()) extra = " (só qua e sáb)";
    if(r.id==="ana"){ const ult = ultimoUso("ana"); if(ult && ult!==hoje() && diasEntre(ult,hoje())<2) extra = " (hoje não é dia)"; }
    if(r.id==="dura" && estado.cfg.ultimaDura){ extra = estado.cfg.ultimaDura===hoje() ? " (aplicada hoje)" : " (próxima: "+proxdura()+")"; }
    div.innerHTML = '<input type="checkbox" '+(feito?"checked":"")+' onchange="marcarRemedio(\''+r.id+'\',this.checked)"><span>'+r.nome+extra+'</span>'; box.appendChild(div);
  });
}
function marcarRemedio(id,ok){
  garantirDia(); const d = estado.dias[hoje()];
  if(id==="furo" && ok){
    if(!ehDiaFuro()){ aviso("Furo só qua e sáb"); renderRemedios(); return; }
    const ult = ultimoUso("furo"); if(ult && ult!==hoje() && diasEntre(ult,hoje())<2){ aviso("Menos de 48h do último furo"); renderRemedios(); return; }
  }
  if(id==="ana" && ok){ const ult = ultimoUso("ana"); if(ult && ult!==hoje() && diasEntre(ult,hoje())<2){ aviso("Anastrozol é a cada 2 dias"); renderRemedios(); return; } }
  if(id==="dura" && ok && estado.cfg.ultimaDura && estado.cfg.ultimaDura!==hoje()){
    const diff = diasEntre(estado.cfg.ultimaDura, hoje());
    if(diff < CFG.duraIntervalo){ aviso("Dura: faltam "+(CFG.duraIntervalo-diff)+" dias"); renderRemedios(); return; }
  }
  if(ok) d.remedios[id] = true; else delete d.remedios[id];
  if(id==="dura" && ok) estado.cfg.ultimaDura = hoje();
  salvar(); renderTudo();
}

function renderSintomas(){
  const d = estado.dias[hoje()], box = document.getElementById("sintomas"); box.innerHTML = "";
  SINTOMAS.forEach(s=>{
    const div = document.createElement("div"); div.className = "chk";
    div.innerHTML = '<input type="checkbox" '+(d.sintomas.includes(s)?"checked":"")+' onchange="marcarSintoma(\''+s+'\',this.checked)"><span>'+s+'</span>'; box.appendChild(div);
  });
}
function marcarSintoma(s,ok){
  garantirDia(); const d = estado.dias[hoje()];
  if(ok && !d.sintomas.includes(s)) d.sintomas.push(s); if(!ok) d.sintomas = d.sintomas.filter(x=>x!==s);
  salvar(); renderAnalise();
}

function salvarVitais(){
  garantirDia(); const d = estado.dias[hoje()];
  const pv = document.getElementById("peso").value.trim(), sv = document.getElementById("sis").value.trim(), dv = document.getElementById("dia").value.trim();
  d.peso = pv ? parseFloat(pv) : null; d.sis = sv ? parseInt(sv) : null; d.dia = dv ? parseInt(dv) : null;
  salvar(); renderAnalise(); renderPeso();
}
function renderPeso(){
  const d = estado.dias[hoje()];
  document.getElementById("peso").value = d.peso ?? ""; document.getElementById("sis").value = d.sis ?? ""; document.getElementById("dia").value = d.dia ?? "";
  const ant = Object.keys(estado.dias).filter(x=>x<hoje() && estado.dias[x].peso).sort().slice(-3), el = document.getElementById("pesoMedia");
  if(ant.length){ const m = ant.reduce((a,x)=>a+estado.dias[x].peso,0)/ant.length; el.textContent = "Média 3 dias: "+m.toFixed(1)+" kg"; } else { el.textContent = ""; }
}

function salvarPotassio(){
  garantirDia(); const d = estado.dias[hoje()], v = document.getElementById("potassio").value.trim();
  d.potassio = v ? parseInt(v) : 0; salvar(); renderPotassio(); renderAnalise();
}
function metaPotassio(){
  const o = ontemStr(), furoOntem = estado.dias[o] && estado.dias[o].remedios && estado.dias[o].remedios.furo;
  return (ehDiaFuro()||furoOntem) ? CFG.potMetaFuro : CFG.potMeta;
}
function renderPotassio(){
  const d = estado.dias[hoje()]; document.getElementById("potassio").value = d.potassio ?? "";
  const meta = metaPotassio(), ing  = d.potassio || 0, falta = Math.max(0, meta-ing);
  document.getElementById("potassioInfo").textContent = ing+" / "+meta+" mg"+(falta?" — faltam "+falta+" mg":" — meta batida");
  const b = document.getElementById("barraPot"); b.style.width = Math.min(100, ing/meta*100)+"%";
  b.style.background = ing>=meta?"#22c55e":ing>=meta*0.7?"#f59e0b":"#ef4444";
}

function registrarCardio(tipo){
  garantirDia(); const d = estado.dias[hoje()];
  d.cardio = { tipo, hora: document.getElementById("cardioHora").value, jejum: document.getElementById("cardioJejum").value };
  if(tipo==="sem") d.cardio.motivo = document.getElementById("cardioMotivo").value || "";
  salvar(); renderCardio(); renderAnalise();
}
function renderCardio(){
  const d = estado.dias[hoje()], el = document.getElementById("cardioInfo");
  if(!d.cardio){ el.textContent = "Nenhum cardio registrado"; return; }
  const c = d.cardio; let t = c.tipo==="sem" ? "Sem cardio" : c.tipo==="hiit" ? "HIIT 5 km" : "Ladeira 10% 40 min";
  if(c.tipo==="sem" && c.motivo) t += " ("+c.motivo+")";
  t += (c.hora ? " · "+c.hora : "") + (c.jejum==="sim" ? " · em jejum" : ""); el.textContent = t;
}

async function carregarModelosFace(){
  if(faceModelosProntos) return true;
  try {
    const uri = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js-models@master/';
    await faceapi.nets.tinyFaceDetector.loadFromUri(uri + 'tiny_face_detector');
    await faceapi.nets.faceLandmark68Net.loadFromUri(uri + 'face_landmark_68');
    faceModelosProntos = true; return true;
  } catch(e){ console.warn(e); return false; }
}

async function carregarFoto(e){
  const f = e.target.files[0]; if(!f) return; const img = new Image();
  img.onload = async function(){
    const c = document.getElementById("canvas"); c.classList.remove("hide"); const ctx = c.getContext("2d");
    const side = Math.min(img.width, img.height), sx = (img.width - side)/2, sy = (img.height - side)/2;
    ctx.drawImage(img, sx, sy, side, side, 0, 0, 300, 300);
    const px = ctx.getImageData(0,0,300,300).data; let soma = 0, n = 0;
    for(let i=0;i<px.length;i+=4){ soma += px[i]+px[i+1]+px[i+2]; n++; } const brilho = soma/n/3;
    const ok = await carregarModelosFace(); let maxilar = null;
    if(ok){
      try {
        const det = await faceapi.detectSingleFace(c, new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.5 })).withFaceLandmarks();
        if(det && det.landmarks){
          const pts = det.landmarks.positions, p3 = pts[3], p13 = pts[13], dx = p3.x - p13.x, dy = p3.y - p13.y;
          maxilar = Math.round(Math.sqrt(dx*dx + dy*dy)); ctx.fillStyle = "#22c55e";
          for(let i=2;i<=14;i++){ const p = pts[i]; ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2); ctx.fill(); }
        }
      } catch(err){ console.warn(err); }
    }
    garantirDia(); const d = estado.dias[hoje()]; d.fotoBrilho = brilho; d.maxilar = maxilar; d.foto = true; salvar();
    let msg = "Brilho: "+brilho.toFixed(0); msg += maxilar ? " · maxilar: "+maxilar+" px" : " · rosto não detectado";
    document.getElementById("fotoResultado").textContent = msg; renderAnalise(); renderHistorico();
  };
  img.src = URL.createObjectURL(f); e.target.value = "";
}

function mediaMaxilar(antes){
  const vals = Object.keys(estado.dias).filter(k => k<antes && estado.dias[k].maxilar).sort().slice(-3).map(k => estado.dias[k].maxilar);
  if(!vals.length) return null; return vals.reduce((a,b)=>a+b,0)/vals.length;
}

function renderAnalise(){
  garantirDia(); const d = estado.dias[hoje()]; let nota = 100; const motivos = []; const meta = metaPotassio();
  if((d.potassio||0) < meta){ nota -= 25; motivos.push("Potássio abaixo da meta"); }
  if(d.sis && d.sis>=140){ nota -= 15; motivos.push("Pressão alta"); }
  if(d.sis && d.sis<90){ nota -= 15; motivos.push("Pressão baixa"); }
  if(d.sintomas.includes("cãibra")||d.sintomas.includes("fraqueza")){ nota -= 10; motivos.push("Sinal de potássio baixo"); }
  if(d.sintomas.includes("rosto piorou")){ nota -= 10; motivos.push("Rosto piorou"); }
  if(d.sintomas.includes("rosto desinchou")){ nota += 5; motivos.push("Rosto desinchou"); }
  if(d.cardio && d.cardio.tipo==="sem"){ motivos.push("Sem cardio"+(d.cardio.motivo?" ("+d.cardio.motivo+")":"")); }
  if(!d.peso) motivos.push("Peso não registrado");
  const mediaM = mediaMaxilar(hoje());
  if(d.maxilar && mediaM){ const pct = ((d.maxilar-mediaM)/mediaM)*100; if(pct > 5){ nota -= 10; motivos.push("Possível inchaço (+"+pct.toFixed(0)+"%)"); } else if(pct < -5){ nota += 5; motivos.push("Rosto mais fino ("+pct.toFixed(0)+"%)"); } }
  nota = Math.max(0, Math.min(100, nota)); const sit = nota>=80?["Em dia","ok"]: nota>=50?["Atenção","at"]:["Alerta","al"];
  const nEl = document.getElementById("nota"); nEl.textContent = nota; nEl.className = "nota "+sit[1];
  document.getElementById("situacao").textContent = sit[0]; document.getElementById("situacao").className = "sit "+sit[1];
  const b = document.getElementById("barraNota"); b.style.width = nota+"%"; b.style.background = sit[1]==="ok"?"#22c55e":sit[1]==="at"?"#f59e0b":"#ef4444";
  const ul = document.getElementById("motivos"); ul.innerHTML = ""; if(!motivos.length) motivos.push("Tudo em ordem");
  motivos.forEach(m=>{ const li=document.createElement("li"); li.textContent=m; ul.appendChild(li); });
}

function gerarRelatorio(){
  garantirDia(); const d = estado.dias[hoje()]; const L = [];
  L.push("RELATÓRIO "+new Date().toLocaleDateString("pt-BR"));
  L.push("Peso: "+(d.peso?d.peso+" kg":"não registrado")); L.push("Pressão: "+(d.sis?d.sis+"/"+d.dia:"não registrada"));
  L.push("Potássio: "+(d.potassio||0)+" de "+metaPotassio()+" mg"); L.push("Furo: "+(d.remedios.furo?"sim":"não")+(ehDiaFuro()?" (dia de furo)":""));
  L.push("Espiro: "+(d.remedios.espiro?"tomou":"não"));
  if(d.cardio){ const c = d.cardio; let t = c.tipo==="sem" ? "sem"+(c.motivo?" ("+c.motivo+")":"") : c.tipo+" "+(c.hora||""); if(c.jejum==="sim") t += " em jejum"; L.push("Cardio: "+t); } else L.push("Cardio: não registrado");
  L.push("Sintomas: "+(d.sintomas.length?d.sintomas.join(", "):"nenhum")); if(d.maxilar) L.push("Maxilar: "+d.maxilar+" px");
  const r = document.getElementById("relatorio"); r.textContent = L.join("\n"); r.classList.remove("hide");
}
function copiarRelatorio(){
  const r = document.getElementById("relatorio"); if(!r.textContent) gerarRelatorio();
  navigator.clipboard.writeText(r.textContent).then(()=>aviso("Copiado")).catch(()=>aviso("Não consegui copiar"));
}

function renderHistorico(){
  renderGraficoPeso(); const box = document.getElementById("historico"); box.innerHTML = ""; const dias = Object.keys(estado.dias).sort().reverse().slice(0,14);
  if(!dias.length){ box.innerHTML = '<p class="sub">Sem registros ainda.</p>'; return; }
  dias.forEach(dia=>{ const d = estado.dias[dia], div = document.createElement("div");
    div.style.cssText = "padding:8px 0;border-bottom:1px solid #334155;font-size:13px";
    let txt = dia+" · "+(d.peso?d.peso+" kg":"—")+" · "+(d.sis?d.sis+"/"+d.dia:"—")+" · K "+(d.potassio||0)+" mg";
    if(d.maxilar) txt += " · max "+d.maxilar+"px"; div.textContent = txt; box.appendChild(div);
  });
}
function renderGraficoPeso(){
  const c = document.getElementById("grafPeso"); if(!c) return; const ctx = c.getContext("2d"), W = c.width, H = c.height; ctx.clearRect(0,0,W,H);
  const dias = Object.keys(estado.dias).sort().filter(k=>estado.dias[k].peso).slice(-14);
  if(dias.length < 2){ ctx.fillStyle = "#64748b"; ctx.font = "16px system-ui"; ctx.textAlign = "center"; ctx.fillText("Registre pelo menos 2 pesos", W/2, H/2); return; }
  const pesos = dias.map(k=>estado.dias[k].peso), min = Math.min(...pesos) - 0.5, max = Math.max(...pesos) + 0.5, pad = 34;
  const xStep = (W - pad*2) / (dias.length - 1), yScale = (H - pad*2) / (max - min);
  ctx.strokeStyle = "#334155"; ctx.lineWidth = 1; for(let i=0;i<=3;i++){ const y = pad + (H - pad*2) * i/3; ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(W-pad, y); ctx.stroke(); }
  ctx.strokeStyle = "#22c55e"; ctx.lineWidth = 2; ctx.beginPath();
  dias.forEach((k,i)=>{ const x = pad + i*xStep, y = H - pad - (estado.dias[k].peso - min)*yScale; if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); }); ctx.stroke();
  ctx.fillStyle = "#2563eb"; dias.forEach((k,i)=>{ const x = pad + i*xStep, y = H - pad - (estado.dias[k].peso - min)*yScale; ctx.beginPath(); ctx.arc(x,y,4,0,Math.PI*2); ctx.fill(); });
  ctx.fillStyle = "#94a3b8"; ctx.font = "12px system-ui"; ctx.textAlign = "center"; ctx.fillText(min.toFixed(1)+"–"+max.toFixed(1)+" kg", W/2, 16);
  ctx.textAlign = "left"; ctx.fillText(dias[0].slice(5), pad, H-10); ctx.textAlign = "right"; ctx.fillText(dias[dias.length-1].slice(5), W-pad, H-10);
}

function renderAjustes(){
  if(estado.cfg.ultimaDura) document.getElementById("ultimaDura").value = estado.cfg.ultimaDura;
  document.getElementById("duraInfo").textContent = "Próxima: "+proxdura(); document.getElementById("espiroInfo").textContent = "Dose atual: "+(estado.cfg.espiro||CFG.espiroDose)+" mg/dia";
}
function salvarDura(){ estado.cfg.ultimaDura = document.getElementById("ultimaDura").value; salvar(); renderAjustes(); }
function subirEspiro(){ const atual = estado.cfg.espiro||CFG.espiroDose; if(atual >= CFG.espiroDoseMax){ aviso("Já está em 50 mg"); return; } estado.cfg.espiro = CFG.espiroDoseMax; salvar(); renderAjustes(); aviso("Subiu para 50 mg"); }

function exportar(){
  const b = new Blob([JSON.stringify(estado,null,2)],{type:"application/json"}), a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = "protocolo-backup-"+hoje()+".json"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function importar(e){
  const f = e.target.files[0]; if(!f) return; const r = new FileReader();
  r.onload = function(){
    try { const data = JSON.parse(r.result); if(!data || typeof data !== "object" || !data.dias) throw new Error("inválido");
      estado = data; if(!estado.dias) estado.dias = {}; if(!estado.cfg) estado.cfg = {};
      garantirDia(); salvar(); renderTudo(); if(abaAtual==="hist") renderHistorico(); if(abaAtual==="aj") renderAjustes(); aviso("Importado");
    } catch(x){ aviso("Arquivo inválido"); }
  };
  r.readAsText(f); e.target.value = "";
}

document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && !document.getElementById("app").classList.contains("hide")){ garantirDia(); renderTudo(); } });

if(localStorage.getItem("protSessao")==="1"){
  document.getElementById("login").classList.add("hide"); document.getElementById("app").classList.remove("hide"); iniciar();
}
</script>
